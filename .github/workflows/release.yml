name: release

# Publishing happens here and nowhere else.
#
# The reason is provenance. npm can attest that a tarball was built by this workflow, from this
# commit, in this public repository, and sign that attestation through sigstore. A consumer then
# runs `npm audit signatures` and gets an answer rather than a promise, which is the same argument
# this library makes about everything else it does.
#
# A publish from somebody's laptop cannot produce that attestation, so it is not how this ships.
#
# There is no npm token in this repository. The registry is told, once, that this workflow in this
# repository is allowed to publish this package, and the publish step then exchanges a short-lived
# OIDC token for the right to do it. A long-lived credential in a settings page is a credential
# somebody can walk off with; one that expires in minutes and only exists inside a public build is
# not.

on:
  release:
    types: [published]

  # A dry run on demand, so the pipeline can be proved without spending a version number.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for provenance. Without it npm signs nothing and the publish is an ordinary one.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing landed in npm 11.5.1. The npm bundled with a Node release is older than
      # that for a long while after, and the failure mode without this line is an ordinary publish
      # with no attestation rather than an error, which is the worst way for it to go wrong.
      - name: Use an npm that can do trusted publishing
        run: npm install --global npm@latest

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: node --test "test/*.test.mjs"

      # The tag and the manifest have to agree, or the release page points at a version that was
      # never published. Checked before the publish rather than discovered after it.
      - name: Tag matches the version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $PKG"
            exit 1
          fi
          echo "tag and package agree on $PKG"

      - name: Pack
        run: npm pack --dry-run

      # No NODE_AUTH_TOKEN. Authentication is the OIDC exchange, and provenance comes with it
      # without asking, so there is no --provenance flag here either.
      - name: Publish
        if: github.event_name == 'release'
        run: npm publish --access public

      - name: Not published
        if: github.event_name != 'release'
        run: echo "dry run only. Publishing runs when a release is published."
