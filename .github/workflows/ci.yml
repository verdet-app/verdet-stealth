name: ci

# The same gate the pre-push hook runs, so a contributor who has not installed the hook cannot
# land something the hook would have refused.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor the package declares. 24 is what most people will actually run it on, and
        # a crypto library that only works on the version its author happens to have is not a
        # library anybody should depend on.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: node --test "test/*.test.mjs"

  history:
    name: history is human
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No assistant identities or co-author trailers
        run: |
          if git log --format='%an%n%ae%n%cn%n%ce%n%B' |
             grep -Eiq 'co-authored-by|claude|copilot|chatgpt|openai|anthropic|noreply@anthropic'; then
            echo "::error::a commit carries a co-author trailer or an assistant identity"
            exit 1
          fi
          echo "history is clean"

  secrets:
    name: no secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # One narrow allowlist, for the published interoperability vector. The reason is in the
          # file, because an exception nobody can read is a scanner nobody should trust.
          GITLEAKS_CONFIG: .gitleaks.toml
